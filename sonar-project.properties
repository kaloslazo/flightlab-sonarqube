# Configuración del escáner para el ejercicio académico FlightLab.
# Ejecutar con: sonar-scanner   (requiere servidor SonarQube activo)

sonar.projectKey=flightlab-sonarqube
sonar.projectName=FlightLab - Laboratorio SonarQube
sonar.projectDescription=Prototipo academico de reservas con defectos deliberados para analisis estatico
sonar.projectVersion=1.0.0

# Solo el codigo del ejercicio: la UI propia, el motor de reservas y los hooks.
sonar.sources=app,lib,hooks

# Se excluye codigo de proveedor (shadcn) y artefactos de build para que el
# reporte se mantenga enfocado en los defectos deliberados del catalogo.
sonar.exclusions=**/node_modules/**,**/components/ui/**,**/.next/**,**/.vinext/**,**/dist/**,**/coverage/**

sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Token de usuario con permiso "Execute Analysis". Generar en:
# Mi cuenta - Seguridad - Generate token.
# sonar.token=TU_TOKEN_AQUI
